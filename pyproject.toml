[project]
name = "insurance-rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation (RAG) system for complex insurance policies."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Shared/Core dependencies (if any shared models are needed, put them here)
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
backend = [
    # Web & API
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    
    # LLM & LangChain Framework
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-community>=0.0.28",
    "langchain-text-splitters>=0.0.1",
    "langchain-google-genai>=1.0.1",
    "langchain-huggingface>=0.0.1",
    "langsmith>=0.1.0",
    "langchain-groq>=0.1.0",
    
    # Vector Databases
    "chromadb>=0.4.24",
    "langchain-chroma>=0.1.0",
    "pinecone>=3.1.0",
    "langchain-pinecone>=0.1.0",
    
    # Lexical Databases
    "redis>=5.0.0",
    
    # Retrieval & Reranking
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.6.0",
    
    # Extraction & Processing
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.4",
    "tiktoken>=0.6.0",
    
    # Core Data Science
    "numpy<2.0.0",
    "protobuf<5.0.0",
    "spacy<3.8.0",
    "scipy<1.13.0",
    "scikit-learn>=1.4.0",
    "tenacity>=8.0.0"
]

ui = [
    "streamlit>=1.32.0"
]

dev = [
    "nest-asyncio>=1.6.0",
    "deepeval>=0.21.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jupyter>=1.0.0"
]
